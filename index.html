<html>
	<head>
		<title>Crew</title>
		<link rel="stylesheet" href="index.css">
	</head>
	<body>
		<img src="index_files/crew.gif" width="200">
		<p>crewbitt@gmail.com</p> 
		<div class="audio-container" onclick="toggleAudio()">
			<span class="play-text">▶</span>
		</div>
		<div>
			<p>Listen to my new album, "I Want to Call You":</p>
			<a href="https://open.spotify.com/album/6QOMgpe07IZHtxjSqlt75Y?si=R46AauxUTVq9rK6Yvrp_7A">Spotify</a>
			<a href="https://music.apple.com/us/album/i-want-to-call-you/6783833646">Apple Music</a>
			<a href="https://tidal.com/album/535804177">Tidal</a>
		</div>
		<audio id="audio" src="index_files/song.wav"></audio>
			<script>
				let isPlaying = false;
				const audio = document.getElementById("audio");
				const playText = document.querySelector(".play-text");
				function toggleAudio() {
					if (isPlaying) {
						audio.pause();
						playText.textContent = "▶";
					} else {
						audio.play();
						playText.textContent = "⏸";
					}
					isPlaying = !isPlaying;
				}
			</script>
	</body>
</html>
